name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Licenses
        run: |
          echo "=== Aceitando licenças do Android SDK ==="
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          echo "=== Instalando Android SDK Platform 36 e Build-Tools ==="
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Environment Files
        run: |
          echo "=== Configurando .env ==="
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          echo "=== Configurando debug.keystore com Chave Permanente Fixa ==="
          if [ -f debug.keystore ] && [ -s debug.keystore ]; then
            echo "debug.keystore ja existe."
          elif [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            echo "Decodificando debug.keystore.base64 do repositorio..."
            base64 -d -i debug.keystore.base64 > debug.keystore
          else
            echo "Restaurando keystore original fixa para manter compatibilidade de atualizacao sem desinstalar..."
            cat << 'EOF' | tr -d '\r\n ' | base64 -d > debug.keystore

EOF
          fi
          ls -la debug.keystore

      - name: Build APKs with Gradle
        run: |
          gradle wrapper --gradle-version 9.3.1 || true
          chmod +x gradlew || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace
          else
            gradle assembleDebug assembleRelease --stacktrace
          fi

      - name: Verify Generated APKs
        run: |
          echo "=== Listando APKs gerados com sucesso ==="
          ls -la app/build/outputs/apk/debug/ || true
          ls -la app/build/outputs/apk/release/ || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
