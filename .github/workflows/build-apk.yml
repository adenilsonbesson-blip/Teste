name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Accept Licenses
        run: |
          echo "=== Configurando Android SDK ==="
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Environment Files and Signing Key
        shell: bash
        run: |
          echo "=== Configurando arquivo .env ==="
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          echo "=== Verificando chave de assinatura sice-app-key.jks ==="
          if [ ! -f sice-app-key.jks ]; then
            keytool -genkeypair -v \
              -keystore sice-app-key.jks \
              -storepass sice2026pass \
              -alias sicekey \
              -keypass sice2026pass \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SICE App,O=SICE,C=BR"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build APKs with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon
          else
            gradle assembleDebug assembleRelease --stacktrace --no-daemon
          fi

      - name: Verify Generated APKs
        run: |
          echo "=== APKs Gerados ==="
          ls -la app/build/outputs/apk/debug/ || true
          ls -la app/build/outputs/apk/release/ || true

      - name: Prepare Direct release.apk and version.json
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "Erro: APK release não encontrado!"
            exit 1
          fi
          cp -f "$RELEASE_APK" release.apk
          SHA256=$(sha256sum release.apk | awk '{print $1}')
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+' || echo "1")
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.0")
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat <<EOF > version.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkFile": "release.apk",
            "sha256": "${SHA256}",
            "buildRunNumber": ${GITHUB_RUN_NUMBER},
            "builtAtUtc": "${BUILT_AT}"
          }
          EOF
          echo "Preparado release.apk (versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}, sha256=${SHA256})"
          cat version.json

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Direct release.apk Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-direct
          path: release.apk
          if-no-files-found: error

      - name: Publish release.apk to GitHub Releases (Direct Download)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RELEASE_TITLE="Condo Entregas - Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="APK gerado automaticamente pelo GitHub Actions (commit ${GITHUB_SHA::7}). Link direto para download automático: release.apk"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release.apk version.json --clobber
            gh release edit latest --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --latest
          else
            gh release create latest release.apk version.json \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi

      - name: Add Direct APK Download Link to Summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/release.apk"
          {
            echo "## 📦 Download Direto do APK (release.apk)"
            echo ""
            echo "O arquivo **\`release.apk\`** foi gerado e publicado diretamente na Release \`latest\` (sem precisar descompactar ZIP):"
            echo ""
            echo "- 🔗 **Link Direto:** [${DIRECT_URL}](${DIRECT_URL})"
            echo "- 📱 **Atualização Automática no App:** Configure \`${{ github.repository }}\` em **Admin > Backup & Sistema** no aplicativo para baixar \`release.apk\` automaticamente sempre que uma nova build for gerada no GitHub."
          } >> "$GITHUB_STEP_SUMMARY"
