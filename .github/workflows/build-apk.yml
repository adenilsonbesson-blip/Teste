name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Accept Licenses
        run: |
          echo "=== Configurando Android SDK ==="
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Environment Files and Signing Key
        shell: bash
        run: |
          echo "=== Configurando arquivo .env ==="
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          echo "=== Verificando chave de assinatura sice-app-key.jks ==="
          if [ ! -f sice-app-key.jks ]; then
            keytool -genkeypair -v \
              -keystore sice-app-key.jks \
              -storepass sice2026pass \
              -alias sicekey \
              -keypass sice2026pass \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SICE App,O=SICE,C=BR"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build APKs with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon
          else
            gradle assembleDebug assembleRelease --stacktrace --no-daemon
          fi

      - name: Verify Generated APKs
        run: |
          echo "=== APKs Gerados ==="
          ls -la app/build/outputs/apk/debug/ || true
          ls -la app/build/outputs/apk/release/ || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
